name: Decimal CI
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: Native decimal bindings
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features luau,serde,async --lib --tests
      - run: cargo test --features luau-jit,luau-vector4,serde --test decimal --test luau
      - run: cargo run --features luau --example decimal
      - name: Build an application from Git dependencies
        shell: bash
        run: |
          app_dir=$(mktemp -d)
          mkdir -p "$app_dir/src"
          cp examples/decimal.rs "$app_dir/src/main.rs"
          cat > "$app_dir/Cargo.toml" <<EOF
          [package]
          name = "decimal-ci-smoke"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          mlua = { git = "https://github.com/${{ github.repository }}", rev = "${{ github.sha }}", features = ["luau"] }
          EOF
          cargo generate-lockfile --manifest-path "$app_dir/Cargo.toml"
          cargo run --locked --manifest-path "$app_dir/Cargo.toml"

  portable:
    name: Portable decimal conformance
    runs-on: ubuntu-latest
    env:
      LUAU_CXXFLAGS: -DLUAU_DECIMAL_PORTABLE
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features luau,serde --test decimal
